name: agarpad
channels:
  - pytorch
  - nvidia
  - conda-forge
  - pyviz
  - bioconda
  - defaults
dependencies:
  - black
  - bokeh
  - dask
  - dask-jobqueue
  - dask-ml
  - datashader
  - distributed
  - fastparquet
  - h5py
  - holoviews
  - hvplot
  - ipywidgets
  - jupyterlab
  - jupyterlab_code_formatter
  - line_profiler
  - matplotlib
  - nd2reader
  - nodejs
  - numpy
  - pandas
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu116
      - torch==2.5.1+cu121
      - torchaudio
      - torchvision
      - omnipose
      - pulp
      - parse
  - pre-commit
  - pyarrow
  - pytables
  - python=3.10.12
  - scikit-image
  - scikit-learn
  - scipy
  - seaborn
  - statsmodels
  - tifffile
  - xarray
  - zarr
